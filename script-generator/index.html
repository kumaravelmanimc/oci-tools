<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OCI Tools | Script Generator</title><style>
:root{--bg:#f4f7fb;--panel:#fff;--text:#1b2937;--muted:#617286;--border:#d5e0eb;--accent:#1661a4;--code:#101c29}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Segoe UI,Arial}.top{background:#142d46;color:#fff;padding:16px max(18px,calc((100vw - 1200px)/2))}.top a{color:#fff;text-decoration:none}.top strong{display:block;font-size:23px;margin-top:5px}.app{max-width:1200px;margin:16px auto;padding:0 14px}.layout{display:grid;grid-template-columns:minmax(360px,430px) 1fr;gap:14px;align-items:start}.panel{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden}.ph{padding:12px 15px;border-bottom:1px solid var(--border);font-weight:700}.pb{padding:14px}.usecase-select{font-weight:650;background:#fff}.guide{margin:10px 0 12px;padding:10px 12px;background:#eff7ff;border-left:3px solid var(--accent);border-radius:6px;color:#294861;line-height:1.45}.guide b{display:block;color:#18334c;margin-bottom:3px}.hint{font-size:11px;color:var(--muted)}.field{margin:9px 0}.field label{display:block;font-weight:650;font-size:12px;margin-bottom:4px}input,textarea,select{width:100%;padding:8px;border:1px solid #bdcbd9;border-radius:6px;font:inherit}textarea{min-height:72px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button.action,.copy{border:0;border-radius:6px;padding:9px 13px;background:var(--accent);color:#fff;font-weight:650;cursor:pointer}.secondary,.copy{background:#e6edf5!important;color:#18334c!important}.output{padding:14px}.summary,.warn{padding:10px;border-radius:7px;margin-bottom:10px}.summary{background:#eff7ff}.warn{background:#fff7e6;border-left:3px solid #d89516}.step{border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:10px}.sh{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:#f7f9fc}.copy{padding:5px 8px;font-size:11px}pre{margin:0;background:var(--code);color:#edf4fb;padding:13px;white-space:pre-wrap;word-break:break-word;font:12px Consolas,monospace}.hidden{display:none}.empty{padding:70px 20px;text-align:center;color:var(--muted)}@media(max-width:900px){.layout{grid-template-columns:1fr}}@media(max-width:500px){.grid2{grid-template-columns:1fr}}
</style></head><body><header class="top"><a href="../">← All tools</a><strong>OCI Script Generator</strong><div>Generate reviewable PowerShell, OCI, DBMS_CLOUD, Data Pump, and user-management runbooks.</div></header><main class="app"><div class="layout"><section class="panel"><div class="ph">1. Select a use case and enter details</div><div class="pb"><label for="usecase" style="display:block;font-weight:700;margin-bottom:5px">Use case</label><select id="usecase" class="usecase-select"></select><div id="guide" class="guide"></div><div id="fields"></div><div class="actions"><button class="action" id="generate">Generate steps</button><button class="action secondary" id="reset">Reset</button></div></div></section><section class="panel"><div class="ph">2. Generated steps <button class="copy" id="copyAll" style="float:right">Copy all</button></div><div id="result" class="empty">Select a use case, enter its values, and choose <b>Generate steps</b>.</div></section></div></main><script>
const cases=[
 ['bastion','Bastion PowerShell','Complete a copied SSH command and optionally generate a key pair.'],
 ['bucketDbms','Bucket → DBMS_CLOUD','Copy an Object Storage object into an Oracle directory.'],
 ['exportDbms','Export dump → DBMS_CLOUD','Export locally, then upload the dump with DBMS_CLOUD.'],
 ['importDbms','Import dump ← DBMS_CLOUD','Download with DBMS_CLOUD, then import with Data Pump.'],
 ['exportObject','Export → Object Storage','Run Data Pump export directly to an Object Storage URI.'],
 ['importObject','Import ← Object Storage','Run Data Pump import directly from an Object Storage URI.'],
 ['createUser','Create database user','Create a user with profile, tablespace, quota, and grants.']
];
const common=`<div class="grid2"><div class="field"><label>ADB service</label><input id="service" placeholder="mydb_high"></div><div class="field"><label>Admin user</label><input id="admin" value="admin"></div></div><div class="grid2"><div class="field"><label>Password placeholder</label><input id="password" value="&lt;ADMIN_PASSWORD&gt;"></div><div class="field"><label>DBMS_CLOUD credential</label><input id="credential" value="OCI$RESOURCE_PRINCIPAL"></div></div><div class="grid2"><div class="field"><label>Directory</label><input id="directory" value="DATA_PUMP_DIR"></div><div class="field"><label>Parallel</label><input id="parallel" value="4"></div></div>`;
const guides={bastion:'Paste the SSH tunnel command copied from the active OCI Bastion session. Supply the private key already paired with the public key used for that session, choose an unused local port, then run the completed command in PowerShell.',bucketDbms:'Downloads one Object Storage object into an Oracle database directory with DBMS_CLOUD.GET_OBJECT. The database credential or resource principal must have read access to the object.',exportDbms:'Creates a Data Pump file in the database directory, then uploads that file with DBMS_CLOUD.PUT_OBJECT. Confirm directory space and Object Storage write permission first.',importDbms:'Downloads a dump into the database directory with DBMS_CLOUD.GET_OBJECT, then imports it with impdp. Use schema remapping only when the target schema is prepared.',exportObject:'Runs Data Pump export directly to an Object Storage URI using a DBMS_CLOUD credential. Confirm that your database version supports credential-based URI dump files.',importObject:'Runs Data Pump import directly from an Object Storage URI. Validate the dump, credential permissions, schemas, and target capacity before execution.',createUser:'Generates a database-user statement with profile, tablespace, quota, and grants. Review the grants for least privilege and apply your password policy.'};
const objectFields=`<div class="field"><label>Object Storage URI</label><input id="uri" placeholder="https://objectstorage.region.oraclecloud.com/n/namespace/b/bucket/o/export.dmp"></div><div class="field"><label>Dump file name</label><input id="dump" value="export.dmp"></div>`;
const forms={
 bastion:`<div class="field"><label>SSH command copied from the OCI Bastion session</label><textarea id="ssh" placeholder='ssh -i &lt;privateKey&gt; -N -L &lt;localPort&gt;:target-host:target-port ...'></textarea><div class="hint">Paste the complete command exactly as OCI presents it.</div></div><div class="field"><label>Local private key path</label><input id="key" value="$HOME\\.ssh\\oci_bastion.key"><div class="hint">Use the private key matching the public key already registered with the Bastion session.</div></div><div class="grid2"><div class="field"><label>Local port</label><input id="localPort" type="number" min="1" max="65535" value="2222"></div><div class="field"><label>Local URL protocol</label><select id="protocol"><option value="https" selected>HTTPS</option><option value="http">HTTP</option></select></div></div>`,
 bucketDbms:common+objectFields,
 exportDbms:common+objectFields+`<div class="field"><label>Schemas</label><input id="schemas" placeholder="APPUSER"></div>`,
 importDbms:common+objectFields+`<div class="grid2"><div class="field"><label>Source schema</label><input id="source" placeholder="APPUSER"></div><div class="field"><label>Target schema (optional remap)</label><input id="target" placeholder="APPUSER_TEST"></div></div>`,
 exportObject:common+objectFields+`<div class="field"><label>Schemas</label><input id="schemas" placeholder="APPUSER"></div>`,
 importObject:common+objectFields+`<div class="grid2"><div class="field"><label>Source schema</label><input id="source" placeholder="APPUSER"></div><div class="field"><label>Target schema (optional remap)</label><input id="target" placeholder="APPUSER_TEST"></div></div>`,
 createUser:`<div class="grid2"><div class="field"><label>Database user</label><input id="dbuser" placeholder="APPUSER"></div><div class="field"><label>Password placeholder</label><input id="userpwd" value="&lt;STRONG_PASSWORD&gt;"></div></div><div class="grid2"><div class="field"><label>Profile</label><input id="profile" value="DEFAULT"></div><div class="field"><label>Default tablespace</label><input id="tablespace" value="DATA"></div></div><div class="grid2"><div class="field"><label>Temporary tablespace</label><input id="temp" value="TEMP"></div><div class="field"><label>Quota</label><input id="quota" value="UNLIMITED"></div></div><div class="field"><label>Grants (comma-separated)</label><input id="grants" value="CREATE SESSION, CREATE TABLE, CREATE VIEW, CREATE SEQUENCE, CREATE PROCEDURE"></div>`
};
let active='bastion',all='';const $=id=>document.getElementById(id),v=id=>$(id)?.value.trim()||'',q=s=>`"${s.replace(/"/g,'`"')}"`,esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function draw(){const select=$('usecase');select.innerHTML=cases.map(c=>`<option value="${c[0]}" ${c[0]===active?'selected':''}>${c[1]}</option>`).join('');$('guide').innerHTML=`<b>${cases.find(c=>c[0]===active)[2]}</b>${guides[active]}`;$('fields').innerHTML=forms[active];select.onchange=()=>{active=select.value;draw()}}
function conn(){return `${v('admin')}/${v('password')}@${v('service')}`}function stamp(){return new Date().toISOString().slice(0,10).replaceAll('-','')}function S(t,w,c){return{t,w,c}}
function generate(){let s=[],warn='Review every placeholder, identifier, target service, URI, and destructive operation before execution.';
 if(active==='bastion'){let cmd=v('ssh'),key=v('key'),port=v('localPort'),protocol=v('protocol');if(!cmd||!key||!port)return alert('Paste the Bastion SSH command and enter the private key path and local port.');if(Number(port)<1||Number(port)>65535)return alert('Local port must be between 1 and 65535.');cmd=cmd.replace(/<privateKey>|<private_key>|<private-key>|PRIVATE_KEY_PATH/gi,q(key)).replace(/<localPort>|<local_port>|<local-port>|LOCAL_PORT/gi,port);if(!/(^|\s)-i\s+/i.test(cmd))cmd=cmd.replace(/^ssh\s+/i,`ssh -i ${q(key)} `);s.push(S('Connect through OCI Bastion','PowerShell',cmd),S('Open the forwarded local address','Browser or client',`${protocol}://localhost:${port}\n\nTunnel endpoint: localhost:${port}`));warn+=' The public key must already be registered with this Bastion session. Keep the private key local and leave the PowerShell tunnel running while using the local URL.'}
 else if(active==='createUser'){let u=v('dbuser').toUpperCase(),gr=v('grants').split(',').map(x=>x.trim()).filter(Boolean).join(', ');s.push(S('Create the database user','SQL*Plus / SQLcl',`CREATE USER ${u}\n  IDENTIFIED BY "${v('userpwd')}"\n  DEFAULT TABLESPACE ${v('tablespace').toUpperCase()}\n  TEMPORARY TABLESPACE ${v('temp').toUpperCase()}\n  PROFILE ${v('profile').toUpperCase()}\n  QUOTA ${v('quota').toUpperCase()} ON ${v('tablespace').toUpperCase()};\n\nGRANT ${gr} TO ${u};\nALTER USER ${u} ACCOUNT UNLOCK;`));warn+=' Confirm the least-privilege grant list and password/profile policy.'}
 else{let uri=v('uri'),dump=v('dump'),dir=v('directory'),cred=v('credential'),p=v('parallel'),c=conn(),src=v('source').toUpperCase(),tgt=v('target').toUpperCase(),schemas=v('schemas').toUpperCase();if(active==='bucketDbms')s.push(S('Copy the bucket object into the database directory','SQL*Plus / SQLcl',`BEGIN\n  DBMS_CLOUD.GET_OBJECT(\n    credential_name => '${cred}',\n    object_uri      => '${uri}',\n    directory_name => '${dir}'\n  );\nEND;\n/`));
 if(active==='exportDbms'){s.push(S('Export schema dump to the database directory','PowerShell',`expdp ${c} DIRECTORY=${dir} DUMPFILE=${dump} SCHEMAS=${schemas} PARALLEL=${p} LOGFILE=export_${stamp()}.log COMPRESSION=ALL`),S('Upload the dump through DBMS_CLOUD','SQL*Plus / SQLcl',`BEGIN\n  DBMS_CLOUD.PUT_OBJECT(\n    credential_name => '${cred}',\n    object_uri      => '${uri}',\n    directory_name => '${dir}',\n    file_name       => '${dump}'\n  );\nEND;\n/`))}
 if(active==='importDbms'){s.push(S('Download the dump through DBMS_CLOUD','SQL*Plus / SQLcl',`BEGIN\n  DBMS_CLOUD.GET_OBJECT(\n    credential_name => '${cred}',\n    object_uri      => '${uri}',\n    directory_name => '${dir}'\n  );\nEND;\n/`),S('Import the downloaded dump','PowerShell',`impdp ${c} DIRECTORY=${dir} DUMPFILE=${dump} PARALLEL=${p} LOGFILE=import_${stamp()}.log${src&&tgt&&src!==tgt?' REMAP_SCHEMA='+src+':'+tgt:''}`))}
 if(active==='exportObject')s.push(S('Export directly to Object Storage','PowerShell',`expdp ${c} CREDENTIAL=${cred} DUMPFILE=${uri} SCHEMAS=${schemas} PARALLEL=${p} LOGFILE=export_${stamp()}.log COMPRESSION=ALL`));
 if(active==='importObject')s.push(S('Import directly from Object Storage','PowerShell',`impdp ${c} CREDENTIAL=${cred} DUMPFILE=${uri} PARALLEL=${p} LOGFILE=import_${stamp()}.log${src&&tgt&&src!==tgt?' REMAP_SCHEMA='+src+':'+tgt:''}`));}
 render(s,warn)}
function render(steps,warn){all=steps.map((x,i)=>`STEP ${i+1} - ${x.t}\n${x.w}\n\n${x.c}`).join('\n\n'+'='.repeat(72)+'\n\n');$('result').className='output';$('result').innerHTML=`<div class="summary"><b>${cases.find(c=>c[0]===active)[1]}</b></div><div class="warn">${esc(warn)}</div>`+steps.map((x,i)=>`<div class="step"><div class="sh"><b>Step ${i+1} · ${esc(x.t)} <span class="hint">— ${esc(x.w)}</span></b><button class="copy" data-copy="${i}">Copy</button></div><pre id="step${i}">${esc(x.c)}</pre></div>`).join('');document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>navigator.clipboard.writeText($('step'+b.dataset.copy).innerText))}
$('generate').onclick=generate;$('reset').onclick=()=>{active='bastion';all='';draw();$('result').className='empty';$('result').innerHTML='Select a use case, enter its values, and choose <b>Generate steps</b>.'};$('copyAll').onclick=()=>all&&navigator.clipboard.writeText(all);draw();
</script></body></html>
